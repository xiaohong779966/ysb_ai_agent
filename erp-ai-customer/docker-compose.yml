services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: erp-ai-customer-backend
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      LOG_FORMAT: json
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - chroma-data:/app/data/chroma
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  chroma-data:
